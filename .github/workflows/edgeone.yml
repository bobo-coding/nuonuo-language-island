name: Check and deploy to EdgeOne Makers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check website and question bank
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run deploy:check

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'nuonuo-language-island-cn' }}
      EDGEONE_SITE: ${{ vars.EDGEONE_SITE || 'china' }}
      EDGEONE_AREA: ${{ vars.EDGEONE_AREA || 'global' }}
    steps:
      - name: Check deployment credential
        id: credential
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [[ -n "$EDGEONE_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped: add the repository secret EDGEONE_API_TOKEN."
            {
              echo '### Deployment has not run'
              echo 'Website checks passed, but the EdgeOne API Token has not been configured.'
              echo 'Add **EDGEONE_API_TOKEN** in repository Settings → Secrets and variables → Actions, then run this workflow again.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credential.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.credential.outputs.configured == 'true'
      - name: Upload static website to EdgeOne Makers
        if: steps.credential.outputs.configured == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_ENV: production
        run: npm run deploy
      - name: Verify actual project acceleration area
        if: steps.credential.outputs.configured == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npm run deploy:verify
